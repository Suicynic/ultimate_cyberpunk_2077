name: Bug report
description: Something in the app is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a playthrough
        2. Go to Job Database
        3. …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: Firefox 141 / Windows 11
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Export snippet (optional)
      description: If data-related, a minimal JSON export snippet helps. Remove anything personal.
